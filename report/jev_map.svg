<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 862" width="960" height="862" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrj" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker></defs>
<rect width="960" height="862" fill="#ffffff"/>
<rect x="24" y="20" width="912" height="474" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="40" y="48" font-size="17" fill="#1f2328" font-weight="700" text-anchor="start">A.  Choosing a tactic</text>
<text x="234" y="48" font-size="13" fill="#59636e" font-weight="400" text-anchor="start">measured in real battles: wins, or net wins vs the default</text>
<line x1="40" y1="72" x2="920" y2="72" stroke="#59636e" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="40" cy="72" r="4" fill="#59636e"/>
<text x="50" y="65" font-size="11.5" fill="#59636e" font-weight="700" text-anchor="start">BEFORE THE BATTLE</text>
<circle cx="490" cy="72" r="4" fill="#59636e"/>
<text x="500" y="65" font-size="11.5" fill="#59636e" font-weight="700" text-anchor="start">DURING THE BATTLE</text>
<rect x="40" y="86" width="430" height="118" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<circle cx="60" cy="108" r="11" fill="#8250df"/>
<text x="60" y="112.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<text x="80" y="113" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">Which program from the tactic library</text>
<text x="80" y="131" font-size="13.5" fill="#1f2328" font-weight="400" text-anchor="start">suits this battle?</text>
<text x="80" y="157" font-size="13" fill="#8250df" font-weight="600" text-anchor="start">Jev 295 / 600 wins</text>
<text x="80" y="176" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start">Lookup of most similar battles: 299 / 600</text>
<rect x="386.9" y="178" width="71.1" height="18" rx="9" fill="#cf222e" fill-opacity="0.12" stroke="#cf222e" stroke-opacity="0.5"/>
<text x="422.45" y="191" font-size="11.5" fill="#cf222e" font-weight="600" text-anchor="middle">no better</text>
<rect x="40" y="218" width="430" height="118" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<circle cx="60" cy="240" r="11" fill="#8250df"/>
<text x="60" y="244.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">2</text>
<text x="80" y="245" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">Same, plus each program's record</text>
<text x="80" y="263" font-size="13.5" fill="#1f2328" font-weight="400" text-anchor="start">in the 8 most similar past battles</text>
<text x="80" y="289" font-size="13" fill="#8250df" font-weight="600" text-anchor="start">Jev +1 net</text>
<text x="80" y="308" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start">Majority vote over those records: +1</text>
<rect x="317.9" y="310" width="140.1" height="18" rx="9" fill="#cf222e" fill-opacity="0.12" stroke="#cf222e" stroke-opacity="0.5"/>
<text x="387.95" y="323" font-size="11.5" fill="#cf222e" font-weight="600" text-anchor="middle">copies the evidence</text>
<rect x="40" y="350" width="430" height="118" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<circle cx="60" cy="372" r="11" fill="#8250df"/>
<text x="60" y="376.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">3</text>
<text x="80" y="377" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">Hold position or push?</text>
<text x="80" y="395" font-size="13.5" fill="#1f2328" font-weight="400" text-anchor="start">(current system, 8 similar battles shown)</text>
<text x="80" y="421" font-size="13" fill="#8250df" font-weight="600" text-anchor="start">Jev +6 net / 720</text>
<text x="80" y="440" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start">Majority vote of the same 8: +5</text>
<rect x="407.6" y="442" width="50.400000000000006" height="18" rx="9" fill="#cf222e" fill-opacity="0.12" stroke="#cf222e" stroke-opacity="0.5"/>
<text x="432.8" y="455" font-size="11.5" fill="#cf222e" font-weight="600" text-anchor="middle">= vote</text>
<rect x="490" y="86" width="430" height="118" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<circle cx="510" cy="108" r="11" fill="#8250df"/>
<text x="510" y="112.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">4</text>
<text x="530" y="113" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">Every step: how should each unit group</text>
<text x="530" y="131" font-size="13.5" fill="#1f2328" font-weight="400" text-anchor="start">fight? attack-move / kite / hold / fall back</text>
<text x="530" y="157" font-size="13" fill="#8250df" font-weight="600" text-anchor="start">Jev 77 / 115 wins</text>
<text x="530" y="176" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start">Random answers: 74 / 115</text>
<rect x="843.8" y="178" width="64.2" height="18" rx="9" fill="#cf222e" fill-opacity="0.12" stroke="#cf222e" stroke-opacity="0.5"/>
<text x="875.9" y="191" font-size="11.5" fill="#cf222e" font-weight="600" text-anchor="middle">≈ random</text>
<rect x="490" y="218" width="430" height="118" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<circle cx="510" cy="240" r="11" fill="#8250df"/>
<text x="510" y="244.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">5</text>
<text x="530" y="245" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">Every 5 steps, only when the value model</text>
<text x="530" y="263" font-size="13.5" fill="#1f2328" font-weight="400" text-anchor="start">is unsure: which preset tactic next?</text>
<text x="530" y="289" font-size="13" fill="#8250df" font-weight="600" text-anchor="start">Jev +4 net / 1,000 (p = 0.61)</text>
<text x="530" y="308" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start">Random pick: −4</text>
<rect x="795.5" y="310" width="112.5" height="18" rx="9" fill="#cf222e" fill-opacity="0.12" stroke="#cf222e" stroke-opacity="0.5"/>
<text x="851.75" y="323" font-size="11.5" fill="#cf222e" font-weight="600" text-anchor="middle">not significant</text>
<rect x="490" y="350" width="430" height="118" rx="8" fill="none" stroke="#d0d7de" stroke-dasharray="4 4"/>
<text x="508" y="380" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-style="italic">Wherever Jev chose, a random pick, a lookup,</text>
<text x="508" y="399" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-style="italic">or a plain vote over the same information</text>
<text x="508" y="418" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-style="italic">did about as well. The best possible pick was</text>
<text x="508" y="437" font-size="13" fill="#59636e" font-weight="400" text-anchor="start" font-style="italic">itself small: +25 of 720 battles for ③.</text>
<rect x="24" y="512" width="912" height="330" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="40" y="540" font-size="17" fill="#1f2328" font-weight="700" text-anchor="start">B.  Judging the battle</text>
<text x="234" y="540" font-size="13" fill="#59636e" font-weight="400" text-anchor="start">measured offline on recorded decision points, no battles played</text>
<rect x="40" y="558" width="430" height="118" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<circle cx="60" cy="580" r="11" fill="#8250df"/>
<text x="60" y="584.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">6</text>
<text x="80" y="585" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">Will we win from here?</text>
<text x="80" y="603" font-size="13.5" fill="#1f2328" font-weight="400" text-anchor="start">(8 similar examples shown)</text>
<text x="80" y="629" font-size="13" fill="#8250df" font-weight="600" text-anchor="start">Jev AUC 0.874</text>
<text x="80" y="648" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start">HP ratio: AUC 0.835</text>
<rect x="262.7" y="650" width="195.3" height="18" rx="9" fill="#9a6700" fill-opacity="0.12" stroke="#9a6700" stroke-opacity="0.5"/>
<text x="360.35" y="663" font-size="11.5" fill="#9a6700" font-weight="600" text-anchor="middle">best judge, not significant</text>
<rect x="490" y="558" width="430" height="118" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<circle cx="510" cy="580" r="11" fill="#8250df"/>
<text x="510" y="584.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">7</text>
<text x="530" y="585" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">What is P(win) after each</text>
<text x="530" y="603" font-size="13.5" fill="#1f2328" font-weight="400" text-anchor="start">of these 13 actions?</text>
<text x="530" y="629" font-size="13" fill="#8250df" font-weight="600" text-anchor="start">Jev rank corr. 0.054</text>
<text x="530" y="648" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start">Our value model: 0.305</text>
<rect x="726.5" y="650" width="181.5" height="18" rx="9" fill="#cf222e" fill-opacity="0.12" stroke="#cf222e" stroke-opacity="0.5"/>
<text x="817.25" y="663" font-size="11.5" fill="#cf222e" font-weight="600" text-anchor="middle">cannot tell actions apart</text>
<rect x="40" y="706" width="430" height="118" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<circle cx="60" cy="728" r="11" fill="#8250df"/>
<text x="60" y="732.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">8</text>
<text x="80" y="733" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">Switch tactics only when Jev</text>
<text x="80" y="751" font-size="13.5" fill="#1f2328" font-weight="400" text-anchor="start">says we are losing (uses ⑥)</text>
<text x="80" y="777" font-size="13" fill="#8250df" font-weight="600" text-anchor="start">Jev +5.42 → +0.06 on fresh data</text>
<text x="80" y="796" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start">Always switch on similar-battle advice: +2.13</text>
<rect x="331.7" y="798" width="126.30000000000001" height="18" rx="9" fill="#cf222e" fill-opacity="0.12" stroke="#cf222e" stroke-opacity="0.5"/>
<text x="394.85" y="811" font-size="11.5" fill="#cf222e" font-weight="600" text-anchor="middle">did not replicate</text>
<rect x="490" y="706" width="430" height="118" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<circle cx="510" cy="728" r="11" fill="#8250df"/>
<text x="510" y="732.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">9</text>
<text x="530" y="733" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">Sanity check: one of two programs is</text>
<text x="530" y="751" font-size="13.5" fill="#1f2328" font-weight="400" text-anchor="start">clearly better here. Which one?</text>
<text x="530" y="777" font-size="13" fill="#8250df" font-weight="600" text-anchor="start">Jev 45 / 73 correct</text>
<text x="530" y="796" font-size="12.5" fill="#59636e" font-weight="400" text-anchor="start">“Pick the option that changes nothing”: 46 / 73</text>
<rect x="781.7" y="798" width="126.30000000000001" height="18" rx="9" fill="#cf222e" fill-opacity="0.12" stroke="#cf222e" stroke-opacity="0.5"/>
<text x="844.85" y="811" font-size="11.5" fill="#cf222e" font-weight="600" text-anchor="middle">no discrimination</text>
<path d="M 104 676 L 104 706" stroke="#8250df" stroke-width="2" fill="none" marker-end="url(#arrj)"/>
<text x="114" y="695.5" font-size="11.5" fill="#8250df" font-weight="700" text-anchor="start">judging well ≠ acting well</text>
</svg>
